---
# Vibepollo uses Dependabot for submodules and Renovate for other dependencies.
version: 2
updates:
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    rebase-strategy: disabled
    schedule:
      interval: "cron"
      cronjob: "30 2 * * *"
      timezone: "America/New_York"
    open-pull-requests-limit: 0
  # CI1: pinned GitHub Actions (commit SHA) only, once a month. Other dependencies unchanged.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
